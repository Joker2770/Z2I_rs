name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # ubuntu-24.04-arm 是预览版 runner，失败不阻塞整个发布流程
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
            experimental: true
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            ext: tar.gz
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --locked --bin pbrain-Z2I_rs --bin train_and_eval --target ${{ matrix.target }}

      - name: Stage and archive (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="stage-${{ matrix.name }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/pbrain-Z2I_rs" "$stage/"
          cp "target/${{ matrix.target }}/release/train_and_eval" "$stage/"
          cp snap/config.toml "$stage/config.toml"
          tar -czf "Z2I_rs-${{ github.ref_name }}-${{ matrix.name }}.${{ matrix.ext }}" -C "$stage" .

      - name: Stage and archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "stage-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/pbrain-Z2I_rs.exe" "$stage/"
          Copy-Item "target/${{ matrix.target }}/release/train_and_eval.exe" "$stage/"
          Copy-Item "snap/config.toml" "$stage/config.toml"
          Compress-Archive -Path "$stage/*" -DestinationPath "Z2I_rs-${{ github.ref_name }}-${{ matrix.name }}.${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z2I_rs-${{ github.ref_name }}-${{ matrix.name }}
          path: Z2I_rs-${{ github.ref_name }}-${{ matrix.name }}.${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
