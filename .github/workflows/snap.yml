name: Snap

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin snap version and source for tag release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s|^version: .*|version: '${TAG_VERSION}'|" snap/snapcraft.yaml
          sed -i "s|^    source-branch: main|    source-tag: ${GITHUB_REF_NAME}|" snap/snapcraft.yaml
          git diff -- snap/snapcraft.yaml

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build

      - name: Publish snap
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge
